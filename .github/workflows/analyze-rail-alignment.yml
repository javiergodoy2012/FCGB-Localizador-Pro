name: Analizar alineación ferroviaria

on:
  push:
    branches: [feature/alinear-trazas]
    paths:
      - index.html
      - scripts/analyze_rail_alignment.mjs
      - .github/workflows/analyze-rail-alignment.yml
  workflow_dispatch:
    inputs:
      ramal:
        description: Ramal a analizar
        required: true
        default: C15

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ramal: [C25]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Consultar y medir la red ferroviaria
        run: node scripts/analyze_rail_alignment.mjs "${{ matrix.ramal }}"

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: rail-alignment-${{ matrix.ramal }}
          path: rail-analysis/
          retention-days: 7
