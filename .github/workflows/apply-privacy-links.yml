name: Apply privacy links

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-privacy-links.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add privacy and account links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          css_marker = "  .access-status.error{color:#ffaaaa}\n"
          css = """  .access-legal{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid #203a55;font-size:12px}
          .access-legal a{color:#a9cbee;text-decoration:none;font-weight:700}
          .access-legal a:hover{text-decoration:underline;color:#fff}
          .site-legal-links{position:fixed;right:12px;bottom:10px;z-index:9998;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
          .site-legal-links a{display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid rgba(93,139,184,.52);border-radius:999px;background:rgba(5,20,38,.9);color:#b9d2e9;text-decoration:none;font-size:10px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25)}
          .site-legal-links a:hover{color:#fff;border-color:#6aa8e6}
          """
          if ".access-legal{" not in html:
              if css_marker not in html:
                  raise SystemExit("CSS marker not found")
              html = html.replace(css_marker, css_marker + css, 1)

          gate_marker = """    <div class="access-status" id="accessStatus"></div>
            </section>
          </div>

          <div class="app" id="dashboardApp">"""
          gate_replacement = """    <div class="access-status" id="accessStatus"></div>
            <nav class="access-legal" aria-label="Privacidad y cuenta">
              <a href="/privacidad/">Política de Privacidad</a>
              <a href="/eliminar-cuenta/">Eliminar cuenta y datos</a>
            </nav>
          </section>
          </div>

          <nav class="site-legal-links" aria-label="Privacidad y administración de cuenta">
            <a href="/privacidad/">Privacidad</a>
            <a href="/eliminar-cuenta/">Eliminar cuenta</a>
          </nav>

          <div class="app" id="dashboardApp">"""
          if 'class="access-legal"' not in html:
              if gate_marker not in html:
                  raise SystemExit("Access gate marker not found")
              html = html.replace(gate_marker, gate_replacement, 1)

          path.write_text(html, encoding="utf-8")
          PY
      - name: Publish links
        shell: bash
        run: |
          git config user.name "Site Vision Automation"
          git config user.email "sitevision.revision@gmail.com"
          git add index.html
          git diff --cached --check
          git commit -m "Enlazar privacidad y eliminación de cuenta"
          git push
